name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 site/build.py
      - run: python3 site/check.py
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@3 pages deploy site/public --project-name=dromgurram --branch=main
      - name: Ping IndexNow
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: python3 site/indexnow.py
